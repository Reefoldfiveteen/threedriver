<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3Driver — AI ke Blender</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f5; color: #222; }
  header { background: #1f2937; color: #fff; padding: 14px 20px; }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #d1d5db; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { margin: 0 0 12px; font-size: 17px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 9px 16px; font-size: 14px; cursor: pointer; margin-top: 12px; }
  button.secondary { background: #6b7280; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .msg { font-size: 13px; margin-top: 10px; padding: 8px; border-radius: 6px; display: none; }
  .msg.ok { display: block; background: #dcfce7; color: #166534; }
  .msg.err { display: block; background: #fee2e2; color: #991b1b; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #e5e7eb; }
  .badge.done { background: #dcfce7; color: #166534; } .badge.error { background: #fee2e2; color: #991b1b; }
  .badge.spec, .badge.codegen, .badge.build, .badge.verify, .badge.queued { background: #dbeafe; color: #1e40af; }
  .job { border-top: 1px solid #e5e7eb; padding: 12px 0; } .job:first-of-type { border-top: 0; }
  .job img { max-width: 100%; border-radius: 6px; margin-top: 8px; }
  pre { background: #111827; color: #e5e7eb; padding: 10px; border-radius: 6px; overflow: auto; font-size: 12px; max-height: 300px; }
  details { margin-top: 8px; } summary { cursor: pointer; font-size: 13px; font-weight: 600; }
  a { color: #2563eb; }
</style>
</head>
<body>
<header><h1>3Driver</h1><p>Prompt + gambar &rarr; script Blender &rarr; model 3D. Lokal saja, di mesin ini.</p></header>
<main>

<div class="card">
  <h2>Pengaturan AI</h2>
  <label for="provider">Provider</label>
  <select id="provider"></select>
  <div class="row">
    <div><label for="model">Model</label><input type="text" id="model"></div>
    <div><label for="base_url">Base URL</label><input type="text" id="base_url"></div>
  </div>
  <label for="api_key">API key</label>
  <input type="password" id="api_key" placeholder="Kosongkan untuk memakai key yang sudah tersimpan">
  <div class="hint">Key tersimpan lokal di settings.json (tidak ikut ke GitHub) dan tidak pernah ditampilkan utuh.</div>
  <div class="row">
    <div><label for="blender">Lokasi Blender (kosong = otomatis)</label><input type="text" id="blender"></div>
    <div><label for="timeout">Timeout per job (detik)</label><input type="number" id="timeout" min="30"></div>
  </div>
  <button id="saveBtn">Simpan pengaturan</button>
  <button id="testBtn" class="secondary">Tes koneksi provider</button>
  <div id="settingsMsg" class="msg"></div>
</div>

<div class="card">
  <h2>Buat model</h2>
  <label for="prompt">Prompt — jelaskan part-nya, sebutkan ukuran kalau ada</label>
  <textarea id="prompt" placeholder="Contoh: plat datar 100x60x10 mm dengan 4 lubang tembus diameter 10 mm di sudut-sudutnya"></textarea>
  <label for="images">Gambar referensi (opsional, maks 5, @ maks 10 MB)</label>
  <input type="file" id="images" accept="image/*" multiple>
  <button id="runBtn">Jalankan</button>
  <div id="jobMsg" class="msg"></div>
</div>

<div class="card">
  <h2>Jobs</h2>
  <div id="jobs"><p class="hint">Belum ada job. Job yang sedang jalan tampil di sini.</p></div>
</div>

</main>
<script>
const $ = id => document.getElementById(id);
let providers = [];

function showMsg(el, text, ok) {
  el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err');
}

async function loadSettings() {
  const [provRes, setRes] = await Promise.all([fetch('/api/providers'), fetch('/api/settings')]);
  const prov = await provRes.json(), set = await setRes.json();
  providers = prov.providers;
  $('provider').innerHTML = providers.map(p => `<option value="${p.id}">${p.label}</option>`).join('');
  $('provider').value = set.provider || 'stub';
  $('model').value = set.model || '';
  $('base_url').value = set.base_url || '';
  $('blender').value = set.blender || '';
  $('timeout').value = set.timeout || 600;
  applyProviderDefaults(false);
}

function applyProviderDefaults(fillEmpty) {
  const p = providers.find(x => x.id === $('provider').value);
  if (!p) return;
  $('model').placeholder = p.default_model || '(isi nama model)';
  $('base_url').placeholder = p.default_base_url || '(isi base URL, mis. http://127.0.0.1:20128 atau URL tunnel 9router)';
  if (fillEmpty) {
    if (!$('model').value) $('model').value = p.default_model || '';
    if (!$('base_url').value) $('base_url').value = p.default_base_url || '';
  }
}
$('provider').addEventListener('change', () => applyProviderDefaults(true));

$('saveBtn').addEventListener('click', async () => {
  const body = { provider: $('provider').value, model: $('model').value.trim(),
    base_url: $('base_url').value.trim(), api_key: $('api_key').value,
    blender: $('blender').value.trim(), timeout: parseInt($('timeout').value || '600', 10) };
  const res = await fetch('/api/settings', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  if (res.ok) { $('api_key').value = ''; showMsg($('settingsMsg'), 'Pengaturan tersimpan.', true); }
  else showMsg($('settingsMsg'), 'Gagal menyimpan: ' + await res.text(), false);
});

$('testBtn').addEventListener('click', async () => {
  showMsg($('settingsMsg'), 'Menghubungi provider…', true);
  const res = await fetch('/api/test-provider', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}' });
  const data = await res.json();
  showMsg($('settingsMsg'), data.ok ? ('Provider OK, balasan: ' + data.reply) : ('Provider gagal: ' + (data.error || 'unknown')), data.ok);
});

$('runBtn').addEventListener('click', async () => {
  const prompt = $('prompt').value.trim();
  if (!prompt) { showMsg($('jobMsg'), 'Prompt masih kosong.', false); return; }
  const fd = new FormData();
  fd.append('prompt', prompt);
  for (const f of $('images').files) fd.append('images', f);
  $('runBtn').disabled = true;
  const res = await fetch('/api/jobs', { method: 'POST', body: fd });
  $('runBtn').disabled = false;
  if (!res.ok) { showMsg($('jobMsg'), 'Gagal membuat job: ' + await res.text(), false); return; }
  const data = await res.json();
  showMsg($('jobMsg'), 'Job ' + data.job_id + ' jalan. Statusnya tampil di bawah.', true);
  refreshJobs();
});

function fileLinks(job) {
  const files = (job.result && job.result.files) || [];
  return files.map(f => `<a href="/api/jobs/${job.job_id}/files/${encodeURIComponent(f)}" target="_blank">${f}</a>`).join(' · ');
}

function renderJobs(jobs) {
  if (!jobs.length) { $('jobs').innerHTML = '<p class="hint">Belum ada job.</p>'; return; }
  $('jobs').innerHTML = jobs.map(j => {
    const r = j.result || {};
    const verified = r.verified ? ' · terverifikasi dari file .blend' : '';
    const preview = (r.files || []).includes('preview.png')
      ? `<img src="/api/jobs/${j.job_id}/files/preview.png" alt="preview">` : '';
    const report = r.report ? `<details><summary>Laporan ukuran (report.json)</summary><pre>${JSON.stringify(r.report, null, 2)}</pre></details>` : '';
    const err = j.error ? `<pre>${j.error}</pre>` : '';
    return `<div class="job"><span class="badge ${j.status}">${j.status}</span> <strong>${j.prompt}</strong>
      <div class="hint">${j.job_id} · ${j.provider || ''} ${j.model || ''}${verified}</div>
      ${preview}<div style="margin-top:6px">${fileLinks(j)}</div>${report}${err}</div>`;
  }).join('');
}

let lastJobsJson = '';
async function refreshJobs() {
  try {
    const res = await fetch('/api/jobs');
    const data = await res.json();
    const ids = data.jobs.map(j => j.job_id);
    const details = await Promise.all(ids.map(async id => (await fetch('/api/jobs/' + id)).json()));
    const s = JSON.stringify(details);
    if (s !== lastJobsJson) { lastJobsJson = s; renderJobs(details); }
  } catch (e) { /* server restart? next poll retries */ }
}

loadSettings();
refreshJobs();
setInterval(refreshJobs, 2500);
</script>
</body>
</html>
